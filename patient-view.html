<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareHub — Patient View</title>
  <meta name="description" content="Patient-friendly simplified view for CareHub activities." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127973;</text></svg>" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Calm warm cream — no busy patterns */
      background: #fdf5ec;
      color: #2d1b0e;
      padding: 24px 16px 80px;
      position: relative;
    }

    /* Subtle warm radial glow in background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(251,191,36,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 75%, rgba(251,146,60,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* GREETING */
    .pv-greeting {
      text-align: center;
      margin-bottom: 48px;
      position: relative; z-index: 1;
    }
    .pv-greeting .hello-emoji {
      font-size: 3.2rem;
      display: block;
      margin-bottom: 10px;
      animation: gentleBob 3s ease-in-out infinite;
    }
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pv-greeting h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      color: #92400e;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .pv-greeting p {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      color: #a16207;
      font-weight: 700;
      margin-top: 8px;
    }

    /* BUTTON GRID */
    .pv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 680px;
      width: 100%;
      position: relative; z-index: 1;
    }

    /* LARGE PATIENT BUTTON */
    .pv-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 170px;
      border-radius: 28px;
      border: 3px solid transparent;
      text-decoration: none;
      cursor: pointer;
      padding: 28px 20px;
      transition:
        transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
        box-shadow 0.22s ease,
        border-color 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    .pv-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0; transition: opacity 0.2s;
      border-radius: 28px;
    }
    .pv-btn:hover::after,
    .pv-btn:focus-visible::after { opacity: 1; }
    .pv-btn:hover, .pv-btn:focus-visible {
      transform: translateY(-6px) scale(1.03);
      outline: none;
    }
    .pv-btn:active { transform: scale(0.97); }

    /* Icon circle */
    .pv-icon {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .pv-btn:hover .pv-icon { transform: scale(1.15) rotate(-6deg); }

    .pv-label {
      font-size: clamp(1.1rem, 3.5vw, 1.45rem);
      font-weight: 900;
      color: white;
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.18);
    }

    /* Color themes per button */
    /* Game — green */
    .pv-btn-game {
      background: linear-gradient(145deg, #10b981, #059669);
      box-shadow: 0 8px 32px rgba(16,185,129,0.38);
      border-color: rgba(255,255,255,0.2);
    }
    .pv-btn-game:hover { box-shadow: 0 18px 48px rgba(16,185,129,0.50); border-color: rgba(255,255,255,0.4); }

    /* Story — warm amber */
    .pv-btn-story {
      background: linear-gradient(145deg, #f59e0b, #d97706);
      box-shadow: 0 8px 32px rgba(245,158,11,0.38);
      border-color: rgba(255,255,255,0.2);
    }
    .pv-btn-story:hover { box-shadow: 0 18px 48px rgba(245,158,11,0.50); border-color: rgba(255,255,255,0.4); }

    /* Help — coral red (most prominent) */
    .pv-btn-help {
      background: linear-gradient(145deg, #ef4444, #dc2626);
      box-shadow: 0 8px 32px rgba(239,68,68,0.42);
      border-color: rgba(255,255,255,0.2);
      /* Gentle pulse to signal urgency */
      animation: helpPulse 3s ease-in-out infinite;
    }
    @keyframes helpPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(239,68,68,0.42); }
      50%       { box-shadow: 0 8px 48px rgba(239,68,68,0.70); }
    }
    .pv-btn-help:hover {
      animation: none;
      box-shadow: 0 18px 52px rgba(239,68,68,0.60);
      border-color: rgba(255,255,255,0.4);
    }

    /* Music — soft purple */
    .pv-btn-music {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      box-shadow: 0 8px 32px rgba(139,92,246,0.38);
      border-color: rgba(255,255,255,0.2);
    }
    .pv-btn-music:hover { box-shadow: 0 18px 48px rgba(139,92,246,0.50); border-color: rgba(255,255,255,0.4); }

    /* BACK LINK — subtle, bottom-right corner */
    .pv-back-link {
      position: fixed;
      bottom: 18px;
      right: 20px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #b45309;
      opacity: 0.45;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: opacity 0.2s;
      z-index: 10;
      letter-spacing: 0.01em;
    }
    .pv-back-link:hover { opacity: 0.75; }
    .pv-back-link i { font-size: 0.65rem; }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .pv-grid { gap: 16px; }
      .pv-btn { min-height: 150px; padding: 22px 14px; border-radius: 22px; }
      .pv-icon { width: 64px; height: 64px; font-size: 30px; }
    }
    @media (max-width: 360px) {
      .pv-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .pv-btn { min-height: 135px; gap: 12px; }
    }
    /* Single column on very narrow */
    @media (max-width: 280px) {
      .pv-grid { grid-template-columns: 1fr; max-width: 280px; }
    }
  </style>
</head>
<body>

  <!-- GREETING -->
  <div class="pv-greeting" role="banner">
    <span class="hello-emoji" aria-hidden="true">👋</span>
    <h1>Hello! What would<br>you like to do?</h1>
    <p>Tap a button below to get started</p>
  </div>

  <!-- 4 LARGE PATIENT BUTTONS -->
  <main class="pv-grid" role="main" aria-label="Activity chooser">

    <a class="pv-btn pv-btn-game" href="games.html" id="pv-game-btn" role="button" aria-label="Play a Game">
      <div class="pv-icon" aria-hidden="true">🎮</div>
      <span class="pv-label">Play a Game</span>
    </a>

    <a class="pv-btn pv-btn-story" href="stories.html" id="pv-story-btn" role="button" aria-label="Listen to a Story">
      <div class="pv-icon" aria-hidden="true">📖</div>
      <span class="pv-label">Listen to a Story</span>
    </a>

    <a class="pv-btn pv-btn-help" href="emergency.html" id="pv-help-btn" role="button" aria-label="Call for Help - Emergency">
      <div class="pv-icon" aria-hidden="true">🚨</div>
      <span class="pv-label">Call for Help</span>
    </a>

    <a class="pv-btn pv-btn-music" href="music.html" id="pv-music-btn" role="button" aria-label="Play Music">
      <div class="pv-icon" aria-hidden="true">🎵</div>
      <span class="pv-label">Play Music</span>
    </a>

  </main>

  <!-- SUBTLE BACK LINK (small, corner-placed — for caregivers only) -->
  <a class="pv-back-link" href="dashboard.html" id="pv-back-link" title="Return to caregiver dashboard">
    <i class="fas fa-chevron-left"></i> Caregiver Dashboard
  </a>

</body>
</html>
