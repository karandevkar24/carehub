<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Auth Guard -->
  <script>
    (function() {
      try {
        var s = sessionStorage.getItem('careHub_user') || localStorage.getItem('careHub_user');
        if (!s) window.location.replace('login.html');
      } catch (e) { window.location.replace('login.html'); }
    })();
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        var s = sessionStorage.getItem('careHub_user') || localStorage.getItem('careHub_user');
        if (!s) window.location.replace('login.html');
      }
    });
  </script>
  <style id="auth-hide">body{display:none!important}</style>
  <!-- GUARANTEED body reveal: plain script, independent of module imports -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var ah = document.getElementById('auth-hide');
      if (ah) ah.remove();
      document.body.style.display = '';
    });
    window.addEventListener('load', function() {
      var ah = document.getElementById('auth-hide');
      if (ah) ah.remove();
      document.body.style.display = '';
    });
  </script><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareHub – Caregiver Profile &amp; Settings</title>
  <meta name="description" content="Manage your caregiver profile, photo, patient details, and care preferences." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>" />

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 50%,#f0fdfa 100%);
      min-height:100vh;
      color:#1e293b;
    }

    /* Header */
    .page-header{background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-bottom:1px solid #e2e8f0;padding:0 24px;position:sticky;top:0;z-index:100;}
    .ph-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px;}
    .back-btn{display:flex;align-items:center;gap:7px;color:#64748b;text-decoration:none;font-size:0.85rem;font-weight:600;padding:7px 16px;border-radius:99px;border:1.5px solid #e2e8f0;transition:all 0.2s;background:white;}
    .back-btn:hover{background:#f0fdfa;color:#0891b2;border-color:#0891b2;}
    .ph-title{font-size:1.05rem;font-weight:800;color:#0f172a;}
    .avatar-sm{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#6366f1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;overflow:hidden;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .avatar-sm img{width:100%;height:100%;object-fit:cover;}

    /* Hero */
    .page-hero{background:linear-gradient(135deg,#0891b2 0%,#6366f1 60%,#14b8a6 100%);padding:48px 24px 60px;text-align:center;position:relative;overflow:hidden;}
    .page-hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Ccircle cx='30' cy='30' r='20' stroke='white' stroke-opacity='0.06' stroke-width='1'/%3E%3C/g%3E%3C/svg%3E") repeat;pointer-events:none;}
    .page-hero h1{font-size:clamp(1.7rem,3.5vw,2.2rem);font-weight:900;color:white;margin-bottom:8px;position:relative;}
    .page-hero p{color:rgba(255,255,255,0.88);font-size:0.95rem;position:relative;}

    /* Content Layout */
    .page-content{max-width:960px;margin:-32px auto 80px;padding:0 20px;position:relative;z-index:10;}

    /* Glass Card */
    .profile-card{
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(20px);
      border:1.5px solid rgba(255,255,255,0.8);
      border-radius:24px;
      box-shadow:0 12px 40px rgba(8,145,178,0.12);
      overflow:hidden;
    }

    /* Photo section */
    .photo-section{
      padding:36px 32px 28px;
      display:flex;
      align-items:center;
      gap:28px;
      border-bottom:1px solid #f1f5f9;
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
    }
    @media(max-width:640px){.photo-section{flex-direction:column;text-align:center;gap:18px;}}

    .photo-wrap{
      position:relative;
      width:110px;
      height:110px;
      flex-shrink:0;
    }
    .photo-avatar{
      width:110px;
      height:110px;
      border-radius:50%;
      background:linear-gradient(135deg,#0891b2,#6366f1);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      font-weight:900;
      color:white;
      overflow:hidden;
      box-shadow:0 6px 20px rgba(8,145,178,0.25);
      border:4px solid white;
    }
    .photo-avatar img{width:100%;height:100%;object-fit:cover;}
    .photo-upload-btn{
      position:absolute;
      bottom:2px;
      right:2px;
      width:34px;
      height:34px;
      background:#0891b2;
      color:white;
      border:2.5px solid white;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:13px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      transition:transform 0.2s, background 0.2s;
    }
    .photo-upload-btn:hover{transform:scale(1.1);background:#0e7490;}
    #file-input{display:none;}

    .photo-info h2{font-size:1.3rem;font-weight:800;color:#0f172a;margin-bottom:4px;}
    .photo-info p{font-size:0.83rem;color:#64748b;margin-bottom:12px;line-height:1.5;}
    .photo-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-outline{
      padding:7px 16px;
      border-radius:99px;
      border:1.5px solid #cbd5e1;
      background:white;
      font-family:'Inter',sans-serif;
      font-size:0.8rem;
      font-weight:700;
      color:#475569;
      cursor:pointer;
      transition:all 0.2s;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .btn-outline:hover{border-color:#0891b2;color:#0891b2;background:#f0fdfa;}
    .preview-badge{display:none;font-size:0.75rem;font-weight:700;color:#f59e0b;background:#fef3c7;padding:3px 10px;border-radius:99px;}

    /* Form body */
    .form-body{padding:32px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
    @media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
    .col-span-2{grid-column:span 2;}
    @media(max-width:700px){.col-span-2{grid-column:span 1;}}

    .section-subtitle{
      font-size:0.88rem;
      font-weight:800;
      color:#0891b2;
      text-transform:uppercase;
      letter-spacing:0.07em;
      margin:18px 0 10px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .section-subtitle:first-of-type{margin-top:0;}

    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-label{font-size:0.82rem;font-weight:700;color:#334155;display:flex;align-items:center;gap:6px;}
    .input-wrap{position:relative;display:flex;align-items:center;}
    .input-icon{position:absolute;left:14px;color:#94a3b8;font-size:14px;}
    .form-input,.form-select,.form-textarea{
      width:100%;
      padding:11px 14px 11px 40px;
      border:1.5px solid #e2e8f0;
      border-radius:12px;
      font-family:'Inter',sans-serif;
      font-size:0.88rem;
      color:#0f172a;
      background:white;
      outline:none;
      transition:all 0.2s;
    }
    .form-input:focus,.form-select:focus,.form-textarea:focus{
      border-color:#0891b2;
      box-shadow:0 0 0 3px rgba(8,145,178,0.12);
    }
    .form-input[readonly]{background:#f8fafc;color:#64748b;cursor:not-allowed;}
    .form-select{padding-left:40px;cursor:pointer;}
    .form-textarea{padding-left:14px;resize:vertical;min-height:80px;}

    /* Form Actions */
    .form-actions{
      margin-top:32px;
      padding-top:24px;
      border-top:1px solid #f1f5f9;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
    }
    .btn-save{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:12px 28px;
      background:linear-gradient(135deg,#0891b2,#6366f1);
      color:white;
      border:none;
      border-radius:99px;
      font-family:'Inter',sans-serif;
      font-size:0.92rem;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(8,145,178,0.3);
      transition:all 0.2s;
    }
    .btn-save:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(8,145,178,0.4);}
    .btn-save:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  </style>
  <link rel="stylesheet" href="./css/perf.css" />
</head>
<body>

<!-- Header -->
<header class="page-header">
  <div class="ph-inner">
    <a class="back-btn" href="dashboard.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    <span class="ph-title"><i class="fas fa-user-cog" style="color:#0891b2;margin-right:6px;"></i>Profile &amp; Settings</span>
    <div class="avatar-sm" id="header-avatar"></div>
  </div>
</header>

<!-- Hero -->
<div class="page-hero">
  <h1>Caregiver Profile &amp; Preferences</h1>
  <p>Update your information, profile picture, and patient care details</p>
</div>

<!-- Main Content -->
<div class="page-content">
  <div class="profile-card">

    <!-- Profile Photo Section -->
    <div class="photo-section">
      <div class="photo-wrap">
        <div class="photo-avatar" id="avatar-display">
          <span id="avatar-initials">CH</span>
        </div>
        <label for="file-input" class="photo-upload-btn" title="Change Photo">
          <i class="fas fa-camera"></i>
        </label>
        <input type="file" id="file-input" accept="image/*" />
      </div>

      <div class="photo-info">
        <h2 id="display-name-header">Caregiver</h2>
        <p>Allowed formats: JPG, PNG, WEBP. Maximum file size: 5MB.</p>
        <div class="photo-actions">
          <label for="file-input" class="btn-outline">
            <i class="fas fa-cloud-upload-alt"></i> Choose Photo
          </label>
          <button type="button" class="btn-outline" id="remove-photo-btn" style="display:none;color:#e11d48;border-color:#fecdd3;">
            <i class="fas fa-trash"></i> Remove
          </button>
          <span class="preview-badge" id="preview-badge"><i class="fas fa-eye"></i> Photo preview ready to save</span>
        </div>
      </div>
    </div>

    <!-- Edit Form -->
    <form class="form-body" id="profile-form">

      <!-- Section: Caregiver Information -->
      <div class="section-subtitle"><i class="fas fa-user"></i> Caregiver Details</div>
      <div class="form-grid">

        <div class="form-group">
          <label class="form-label" for="inp-name">Full Name <span style="color:#f43f5e;">*</span></label>
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-input" id="inp-name" required placeholder="e.g. Karan Mehta" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-email">Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-input" id="inp-email" readonly title="Email cannot be changed directly" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-phone">Contact Number</label>
          <div class="input-wrap">
            <i class="fas fa-phone input-icon"></i>
            <input type="tel" class="form-input" id="inp-phone" placeholder="+91 98765 43210" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-role">Your Role</label>
          <div class="input-wrap">
            <i class="fas fa-user-tag input-icon"></i>
            <select class="form-select" id="inp-role">
              <option value="Family Member">Family Member</option>
              <option value="Nurse">Nurse</option>
              <option value="Professional Caregiver">Professional Caregiver</option>
              <option value="Doctor / Physician">Doctor / Physician</option>
              <option value="Volunteer">Volunteer</option>
            </select>
          </div>
        </div>

      </div>

      <!-- Section: Patient Information -->
      <div class="section-subtitle" style="margin-top:28px;"><i class="fas fa-heartbeat"></i> Patient in Care</div>
      <div class="form-grid">

        <div class="form-group">
          <label class="form-label" for="inp-patient">Patient's Full Name</label>
          <div class="input-wrap">
            <i class="fas fa-user-injured input-icon"></i>
            <input type="text" class="form-input" id="inp-patient" placeholder="e.g. Ramesh Mehta" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-patient-age">Patient's Age</label>
          <div class="input-wrap">
            <i class="fas fa-birthday-cake input-icon"></i>
            <input type="number" class="form-input" id="inp-patient-age" placeholder="e.g. 74" min="1" max="120" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-stage">Diagnosed Stage</label>
          <div class="input-wrap">
            <i class="fas fa-brain input-icon"></i>
            <select class="form-select" id="inp-stage">
              <option value="Early / Mild">Early / Mild Dementia</option>
              <option value="Middle / Moderate">Middle / Moderate Dementia</option>
              <option value="Late / Advanced">Late / Advanced Dementia</option>
              <option value="Under Evaluation">Under Evaluation / Mild Cognitive Impairment</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-emergency-contact">Emergency Contact Person &amp; Phone</label>
          <div class="input-wrap">
            <i class="fas fa-ambulance input-icon"></i>
            <input type="text" class="form-input" id="inp-emergency-contact" placeholder="e.g. Dr. Verma (+91 98111 22233)" />
          </div>
        </div>

        <div class="form-group col-span-2">
          <label class="form-label" for="inp-notes">Medical Notes &amp; Special Care Instructions</label>
          <textarea class="form-textarea" id="inp-notes" placeholder="Enter allergies, daily habits, preferred music, or special care notes..."></textarea>
        </div>

      </div>

      <!-- Actions -->
      <div class="form-actions">
        <a href="dashboard.html" class="btn-outline"><i class="fas fa-times"></i> Cancel</a>
        <button type="submit" class="btn-save" id="save-btn">
          <i class="fas fa-check-circle"></i> Save Changes
        </button>
      </div>

    </form>

  </div>
</div>

<script type="module">
  import { getSession, populateHeader, showToast, initials } from './js/ui.js';
  import { auth, db } from './js/firebase.js';
  import { doc, getDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const user = await getSession();
  if (user) populateHeader(user);
  document.getElementById('auth-hide')?.remove();
  document.body.style.display = '';

  let newPhotoDataUrl = null;

  // Render user data into form
  function renderUserData(data) {
    const name = data.name || 'Caregiver';
    document.getElementById('display-name-header').textContent = name;
    document.getElementById('inp-name').value = name;
    document.getElementById('inp-email').value = data.email || '';
    document.getElementById('inp-phone').value = data.phone || '';
    if (data.role) document.getElementById('inp-role').value = data.role;
    document.getElementById('inp-patient').value = data.patientName || '';
    if (data.patientAge) document.getElementById('inp-patient-age').value = data.patientAge;
    if (data.stage) document.getElementById('inp-stage').value = data.stage;
    if (data.emergencyContact) document.getElementById('inp-emergency-contact').value = data.emergencyContact;
    if (data.notes) document.getElementById('inp-notes').value = data.notes;

    updateAvatarDisplay(data.photoURL, name);
  }

  function updateAvatarDisplay(photoUrl, name) {
    const avatarEl = document.getElementById('avatar-display');
    const removeBtn = document.getElementById('remove-photo-btn');
    if (photoUrl) {
      avatarEl.innerHTML = `<img src="${photoUrl}" alt="${name}" />`;
      removeBtn.style.display = 'inline-flex';
    } else {
      avatarEl.innerHTML = `<span id="avatar-initials">${initials(name || 'Caregiver')}</span>`;
      removeBtn.style.display = 'none';
    }
  }

  // Load from Firestore first if available
  async function loadFullProfile() {
    renderUserData(user);
    if (auth.currentUser) {
      try {
        const snap = await getDoc(doc(db, 'users', auth.currentUser.uid));
        if (snap.exists()) {
          renderUserData({ ...user, ...snap.data() });
        }
      } catch (e) {
        console.warn('Could not load Firestore profile:', e);
      }
    }
  }
  loadFullProfile();

  // Photo Selection & Preview
  const fileInput = document.getElementById('file-input');
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      showToast('Image file too large (max 5MB)', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = ev => {
      newPhotoDataUrl = ev.target.result;
      const avatarEl = document.getElementById('avatar-display');
      avatarEl.innerHTML = `<img src="${newPhotoDataUrl}" alt="Preview" />`;
      document.getElementById('preview-badge').style.display = 'inline-block';
      document.getElementById('remove-photo-btn').style.display = 'inline-flex';
      showToast('Photo selected! Click "Save Changes" below to apply.', 'success', 3000);
    };
    reader.readAsDataURL(file);
  });

  // Remove Photo button
  document.getElementById('remove-photo-btn').addEventListener('click', () => {
    newPhotoDataUrl = '';
    fileInput.value = '';
    document.getElementById('preview-badge').style.display = 'none';
    updateAvatarDisplay('', document.getElementById('inp-name').value);
    showToast('Photo cleared. Click "Save Changes" to apply.', 'warn', 2500);
  });

  // Form Submit
  document.getElementById('profile-form').addEventListener('submit', async e => {
    e.preventDefault();
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

    const name = document.getElementById('inp-name').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();
    const role = document.getElementById('inp-role').value;
    const patientName = document.getElementById('inp-patient').value.trim();
    const patientAge = document.getElementById('inp-patient-age').value.trim();
    const stage = document.getElementById('inp-stage').value;
    const emergencyContact = document.getElementById('inp-emergency-contact').value.trim();
    const notes = document.getElementById('inp-notes').value.trim();

    const updatedFields = {
      name,
      phone,
      role,
      patientName,
      patientAge,
      stage,
      emergencyContact,
      notes,
    };

    if (newPhotoDataUrl !== null) {
      updatedFields.photoURL = newPhotoDataUrl;
    }

    try {
      // 1. Update Firebase Auth Profile
      if (auth.currentUser) {
        const authUpdates = { displayName: name };
        if (newPhotoDataUrl && !newPhotoDataUrl.startsWith('data:')) {
          authUpdates.photoURL = newPhotoDataUrl;
        }
        await updateProfile(auth.currentUser, authUpdates).catch(() => {});

        // 2. Update Firestore document
        await setDoc(doc(db, 'users', auth.currentUser.uid), updatedFields, { merge: true });
      }

      // 3. Update Session Cache
      const curSession = JSON.parse(sessionStorage.getItem('careHub_user') || localStorage.getItem('careHub_user') || '{}');
      const mergedUser = { ...curSession, ...updatedFields };
      sessionStorage.setItem('careHub_user', JSON.stringify(mergedUser));
      if (localStorage.getItem('careHub_user')) {
        localStorage.setItem('careHub_user', JSON.stringify(mergedUser));
      }

      // Update UI
      document.getElementById('display-name-header').textContent = name;
      document.getElementById('header-name').textContent = name.split(' ')[0];
      const hdrAvatar = document.getElementById('header-avatar');
      if (mergedUser.photoURL) {
        hdrAvatar.innerHTML = `<img src="${mergedUser.photoURL}" style="width:100%;height:100%;object-fit:cover;" />`;
      } else {
        hdrAvatar.textContent = initials(name);
      }
      document.getElementById('preview-badge').style.display = 'none';

      showToast('Profile updated successfully! 🎉', 'success', 3500);
    } catch (err) {
      console.error('Profile update error:', err);
      showToast('Profile saved locally (' + (err.message || 'offline') + ')', 'warn', 3500);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save Changes';
    }
  });
</script>
<script src="./js/page-transition.js"></script>
</body>
</html>
